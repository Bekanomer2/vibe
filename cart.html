<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b1a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap">
    <script src="js/theme.js"></script>
  <title>Корзина — EzShop</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-loading">
  <div class="loader-overlay" id="pageLoader">
    <img src="img/logo.png" alt="Загрузка" class="loader-logo">
  </div>

  <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="logo" aria-label="EzShop — на главную">
                <img src="img/logo.png" alt="EzShop">
            </a>
            <nav id="nav" class="main-nav" aria-label="Главное меню">
            <a href="index.html" data-icon="grid">Каталог</a>
            <a href="javascript:void(0)" onclick="openFavoritesModal()" data-icon="heart">Избранное <span class="nav-count nav-fav-count">0</span></a>
            <a href="orders.html" class="nav-orders-link" data-icon="package">Заказы</a>
            <a href="admin.html" class="admin-only-nav" data-icon="shield">Админка</a>
                <div class="user-panel">
                    <span id="usernameDisplay"></span>
                    <button type="button" onclick="logout()">Выйти</button>
                </div>
            </nav>
            <div class="burger" id="burger"><span></span><span></span><span></span></div>
        </div>
    </header>

  <main class="container cart-page-container">
    <div class="page-head" data-reveal>
      <a href="index.html" class="back-link"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7M19 12H5"/></svg> Вернуться в каталог</a>
      <h1>Ваша корзина</h1>
    </div>

    <div class="cart-layout">
      <div id="items" class="cart-items"></div>

      <aside class="cart-summary">
        <div class="total" id="total"></div>
        <button id="checkout" type="button" class="btn btn-primary">Оформить заказ</button>

        <div id="order" class="order-form" style="display:none;">
          <h3>Данные получателя</h3>
          <label class="cart-field">
            <span>Имя и фамилия</span>
            <input id="name" class="cart-input" placeholder="Например, Айбек Асанов" autocomplete="name">
          </label>
          <label class="cart-field">
            <span>Номер телефона</span>
            <input id="phone" class="cart-input" placeholder="+996 ..." inputmode="tel" autocomplete="tel">
          </label>
          <small class="cart-note">Просьба указывать корректный номер телефона. Менеджер свяжется с вами для подтверждения заказа.</small>
          <label class="cart-field">
            <span>Адрес доставки</span>
            <input id="address" class="cart-input" placeholder="Город, улица, дом / квартира" autocomplete="street-address">
          </label>
          <button id="send" type="button" class="btn btn-primary">Подтвердить заказ</button>
        </div>
      </aside>
    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <!-- Модульные скрипты -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/products-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
