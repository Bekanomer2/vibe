<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои заказы — EzShop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-loading">
    <div class="loader-overlay" id="pageLoader">
        <img src="img/logo.png" alt="Loading..." class="loader-logo">
    </div>

    <header>
        <a href="index.html" class="logo">
            <img src="img/logo.png" alt="EzShop Logo">
        </a>
        <nav id="nav">
            <a href="index.html">🛍️ Каталог</a>
            <a href="javascript:void(0)" onclick="openFavoritesModal()">❤️ Избранное (<span class="nav-fav-count">0</span>)</a>
            <a href="admin.html" class="admin-only-nav">⚙️ Админка</a>
            <div class="user-panel">
                <span id="usernameDisplay"></span>
                <button onclick="logout()">Выйти</button>
            </div>
        </nav>
        <div class="burger" id="burger"><span></span><span></span><span></span></div>
    </header>

    <div class="container orders-container">
        <div class="orders-page-header">
            <a href="index.html" class="back-link">← Вернуться в магазин</a>
            <h1>📦 История заказов</h1>
            <p class="orders-subtitle">Отслеживайте статусы ваших покупок в режиме реального времени</p>
        </div>

        <div id="ordersList" class="orders-list">
            <div style="text-align: center; color: var(--muted); padding: 40px;">Загрузка заказов...</div>
        </div>
    </div>

    <a href="cart.html" class="cart-btn" id="cartBtn">🛒 <span class="btn-text">Корзина</span> <span id="cartCount">0</span></a>
    <div class="toast-container" id="toastContainer"></div>

    <!-- Модульные скрипты -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/products-data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/favorites.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
